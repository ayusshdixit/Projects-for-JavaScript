<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Weather App</h1>

    <div class="search-box">

        <input
            type="text"
            id="cityInput"
            placeholder="Enter city name"
        >

        <button id="searchBtn">
            Search
        </button>

    </div>

    <div class="weather-card">

        <img
            id="weatherIcon"
            src=""
            alt="Weather Icon"
        >

        <h2 id="temperature">
            --
        </h2>

        <h3 id="cityName">
            City
        </h3>

        <p id="description">
            Weather Description
        </p>

        <div class="details">

            <div class="detail">
                <h4>Humidity</h4>
                <p id="humidity">--%</p>
            </div>

            <div class="detail">
                <h4>Wind Speed</h4>
                <p id="windSpeed">-- km/h</p>
            </div>

        </div>

    </div>

</div>

<script src="WeatherApp.js"></script>

</body>
</html>
