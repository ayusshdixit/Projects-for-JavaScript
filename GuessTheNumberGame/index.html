<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Number</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Guess the Number</h1>

    <p>Guess a number between <strong>1</strong> and <strong>100</strong>.</p>

    <input type="number" id="guessInput" placeholder="Enter your guess">

    <button id="submitBtn">Submit Guess</button>

    <div class="result">

        <p>Previous Guesses:
            <span id="previousGuesses"></span>
        </p>

        <p>Guesses Remaining:
            <span id="guessesLeft">10</span>
        </p>

        <h2 id="message"></h2>

    </div>

</div>

<script src="GuesstheNumberGame.js"></script>

</body>
</html>
